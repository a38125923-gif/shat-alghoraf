<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم الشاملة - شات الاصيل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1e293b 0%, #0b1120 60%, #050814 100%);
      color: #f8fafc;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
    }
    .adm-page-wrap {
      max-width: 1180px;
      margin: 20px auto;
      padding: 0 14px 40px;
    }
    .adm-card-surface {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 16px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }
    .adm-gate-box {
      max-width: 430px;
      margin: 60px auto;
      padding: 26px 22px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .adm-gate-box h2 {
      margin: 0;
      font-size: 19px;
      color: #fef3c7;
      text-align: center;
    }
    .adm-gate-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(30, 41, 59, 0.9);
      color: #f8fafc;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="adm-page-wrap">
    <div id="admLoginGate" class="adm-gate-box hidden">
      <h2><i class="fa-solid fa-crown" style="color:#F59E0B;"></i> تسجيل دخول لوحة التحكم</h2>
      <p class="muted" style="margin:0;font-size:13px;text-align:center;">الوصول مخصص للمالك والمشرفين المصرح لهم فقط.</p>
      <div id="admGateError" class="form-error hidden"></div>
      <form id="admGateForm" style="display:flex;flex-direction:column;gap:10px;">
        <input type="text" id="admGateUser" placeholder="اسم المستخدم أو البريد الإلكتروني" required />
        <input type="password" id="admGatePass" placeholder="كلمة المرور" required />
        <button type="submit" class="btn-primary">دخول إلى لوحة التحكم</button>
      </form>
      <button type="button" id="admGoogleBtn" class="btn-secondary" style="display:flex;align-items:center;justify-content:center;gap:8px;">
        <i class="fa-brands fa-google"></i> تسجيل الدخول عبر Google
      </button>
      <a href="/" class="btn-secondary btn-xs" style="text-align:center;text-decoration:none;">العودة إلى الدردشة</a>
    </div>

    <div id="admDashboardRoot" class="adm-card-surface hidden">
      <div style="padding:36px;text-align:center;color:#94a3b8;">جاري التحقق من الصلاحيات...</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/firebase-client.js"></script>
  <script>
    (function () {
      const TOKEN_KEY = 'arabic_chat_token_v3';
      const DEVICE_KEY = 'arabic_chat_device_id_v1';
      let deviceId = localStorage.getItem(DEVICE_KEY);
      if (!deviceId) {
        deviceId = 'adm_' + Math.random().toString(36).slice(2, 11);
        localStorage.setItem(DEVICE_KEY, deviceId);
      }

      const gate = document.getElementById('admLoginGate');
      const gateErr = document.getElementById('admGateError');
      const root = document.getElementById('admDashboardRoot');

      function showGate(errMsg) {
        root.classList.add('hidden');
        gate.classList.remove('hidden');
        if (errMsg) {
          gateErr.textContent = errMsg;
          gateErr.classList.remove('hidden');
        } else {
          gateErr.classList.add('hidden');
        }
      }

      function loadAdminPanelScript(token) {
        return new Promise((resolve, reject) => {
          if (window.AsilAdminPanel) return resolve();
          const s = document.createElement('script');
          s.src = '/admin-panel.js?token=' + encodeURIComponent(token);
          s.async = false;
          s.onload = () => (window.AsilAdminPanel ? resolve() : reject(new Error('تعذر تحميل لوحة التحكم.')));
          s.onerror = () => reject(new Error('غير مصرح بالوصول إلى لوحة التحكم.'));
          document.body.appendChild(s);
        });
      }

      async function bootSession() {
        const token = localStorage.getItem(TOKEN_KEY) || '';
        if (!token) {
          showGate('');
          return;
        }
        try {
          const meRes = await fetch('/api/me', {
            headers: {
              Authorization: 'Bearer ' + token,
              'X-Device-Id': deviceId,
              'X-Client-Fingerprint': deviceId
            }
          });
          const meData = await meRes.json().catch(() => ({}));
          if (!meRes.ok || !meData.user || meData.user.isGuest) {
            localStorage.removeItem(TOKEN_KEY);
            showGate(meData.error || 'يرجى تسجيل الدخول بحساب إداري.');
            return;
          }
          await loadAdminPanelScript(meData.token || token);
          gate.classList.add('hidden');
          root.classList.remove('hidden');
          window.AsilAdminPanel.mountStandalone(root, {
            token: meData.token || token,
            deviceId,
            user: meData.user,
            onLogout: () => {
              localStorage.removeItem(TOKEN_KEY);
              showGate('تم تسجيل الخروج.');
            }
          });
        } catch (err) {
          showGate(err.message || 'غير مصرح بالدخول.');
        }
      }

      document.getElementById('admGateForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        gateErr.classList.add('hidden');
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Device-Id': deviceId,
              'X-Client-Fingerprint': deviceId
            },
            body: JSON.stringify({
              identifier: document.getElementById('admGateUser').value.trim(),
              password: document.getElementById('admGatePass').value
            })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.token) throw new Error(data.error || 'فشل تسجيل الدخول.');
          localStorage.setItem(TOKEN_KEY, data.token);
          await bootSession();
        } catch (err) {
          showGate(err.message || 'تعذر تسجيل الدخول.');
        }
      });

      document.getElementById('admGoogleBtn')?.addEventListener('click', async () => {
        gateErr.classList.add('hidden');
        try {
          const pubRes = await fetch('/api/settings/public');
          const pub = await pubRes.json().catch(() => ({}));
          if (!window.AsilRealtime?.signInWithGoogle) throw new Error('تسجيل Google غير متاح حالياً.');
          const idToken = await window.AsilRealtime.signInWithGoogle(pub.firebaseWebConfig);
          const authRes = await fetch('/api/auth/firebase', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Device-Id': deviceId,
              'X-Client-Fingerprint': deviceId
            },
            body: JSON.stringify({ idToken })
          });
          const authData = await authRes.json().catch(() => ({}));
          if (!authRes.ok || !authData.token) throw new Error(authData.error || 'فشل تسجيل Google.');
          localStorage.setItem(TOKEN_KEY, authData.token);
          await bootSession();
        } catch (err) {
          showGate(err.message || 'فشل تسجيل الدخول عبر Google.');
        }
      });

      bootSession();
    })();
  </script>
</body>
</html>
