[versions]
agp = "9.1.1"
kotlin = "2.2.10"
googleServices = "4.4.2"
firebaseBom = "34.0.0"
credentials = "1.5.0"
googleid = "1.1.1"
coilCompose = "2.7.0"
coreKtx = "1.17.0"
